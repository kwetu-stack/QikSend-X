{% extends "base.html" %}
{% block title %}Login · QikSend-X{% endblock %}

{% block content %}
<h1 class="h1">Login</h1>

<form method="post" class="card" style="max-width:460px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if error %}
  <div class="notice" style="border-left:4px solid #ef4444">{{ error }}</div>
  {% endif %}

  <label>Username</label>
  <input class="input" name="username" placeholder="admin" required>

  <label>Password</label>
  <input class="input" type="password" name="password" placeholder="admin123" required>

  <div style="margin-top:12px;display:flex;gap:10px;align-items:center">
    <button class="btn" type="submit">Login</button>
    <a class="btn secondary" href="{{ url_for('track') }}">Go to Public Tracking</a>
  </div>
</form>
{% endblock %}
