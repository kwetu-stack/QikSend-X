{% extends "base.html" %}
{% block title %}{{ 'Edit' if customer else 'New' }} Customer · QikSend-X{% endblock %}
{% block content %}
<h1 class="h1">{{ 'Edit' if customer else 'New' }} Customer</h1>

<form method="post" class="card" style="max-width:640px">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-grid">
    <div>
      <label>Name</label>
      <input class="input" name="name" value="{{ customer.name if customer else '' }}" required>
    </div>
    <div>
      <label>Phone</label>
      <input class="input" name="phone" value="{{ customer.phone if customer else '' }}" placeholder="+2547..." required>
    </div>
  </div>

  <div style="margin-top:12px;display:flex;gap:8px">
    <button class="btn" type="submit">{{ 'Save Changes' if customer else 'Create Customer' }}</button>
    <a class="btn" href="{{ url_for('customers') }}">Cancel</a>
  </div>
</form>
{% endblock %}
