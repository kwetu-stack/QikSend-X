{% extends "base.html" %}
{% block title %}Customers · QikSend-X{% endblock %}
{% block content %}
<h1 class="h1">Customers</h1>

<div style="margin-bottom:12px">
  <a class="btn" href="{{ url_for('new_customer') }}">New Customer</a>
</div>

<div class="card">
  <table class="table">
    <thead>
      <tr><th>Name</th><th>Phone</th><th>Created</th><th style="width:200px">Action</th></tr>
    </thead>
    <tbody>
      {% for c in customers %}
      <tr>
        <td>{{ c.name }}</td>
        <td>{{ c.phone }}</td>
        <td>{{ c.created_at }}</td>
        <td>
          <a href="{{ url_for('edit_customer', id=c.id) }}">Edit</a>
          <form method="post" action="{{ url_for('delete_customer', id=c.id) }}"
                style="display:inline;margin-left:8px"
                onsubmit="return confirm('Delete this customer?');">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <button class="btn btn-small danger" type="submit">Delete</button>
          </form>
        </td>
      </tr>
      {% else %}
      <tr><td colspan="4" class="muted">No customers yet.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</div>
{% endblock %}
