{% extends "base.html" %}
{% block title %}New Parcel · QikSend-X{% endblock %}

{% block content %}
<h1 class="h1">Create New Parcel</h1>

<form method="post" class="card">
  <div class="form-grid">
    <!-- Sender / Recipient (DB-driven) -->
    <div>
      <label>Sender</label>
      <select class="input" name="sender_id" required>
        <option value="" disabled selected>Select sender</option>
        {% for c in customers %}
          <option value="{{ c['id'] }}">{{ c['name'] }} ({{ c['phone'] }})</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Recipient</label>
      <select class="input" name="recipient_id" required>
        <option value="" disabled selected>Select recipient</option>
        {% for c in customers %}
          <option value="{{ c['id'] }}">{{ c['name'] }} ({{ c['phone'] }})</option>
        {% endfor %}
      </select>
    </div>

    <!-- Origin / Destination branches (DB-driven) -->
    <div>
      <label>Origin Branch</label>
      <select class="input" name="origin_branch_id" required>
        <option value="" disabled selected>Select origin</option>
        {% for b in branches %}
          <option value="{{ b['id'] }}">{{ b['name'] }} — {{ b['location'] }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Destination Branch</label>
      <select class="input" name="destination_branch_id" required>
        <option value="" disabled selected>Select destination</option>
        {% for b in branches %}
          <option value="{{ b['id'] }}">{{ b['name'] }} — {{ b['location'] }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Optional courier assignment -->
    <div>
      <label>Assign Courier (optional)</label>
      <select class="input" name="courier_id">
        <option value="">— Unassigned —</option>
        {% for r in couriers %}
          {% if r['active'] %}
            <option value="{{ r['id'] }}">{{ r['name'] }} ({{ r['phone'] }})</option>
          {% endif %}
        {% endfor %}
      </select>
    </div>

    <!-- Parcel details -->
    <div>
      <label>Description</label>
      <input class="input" name="description" placeholder="Small electronics">
    </div>

    <div>
      <label>Amount (KES)</label>
      <input class="input" type="number" step="0.01" name="amount" value="300" required>
    </div>
  </div>

  <div style="margin-top:12px">
    <button class="btn" type="submit">Save &amp; Generate Tracking</button>
  </div>
</form>
{% endblock %}
