{% extends "base.html" %}
{% block title %}New Parcel · QikSend-X{% endblock %}

{% block content %}
<h1 class="h1">Create New Parcel</h1>

<form method="post" class="card">
  <div class="form-grid">

    <div>
      <label>Sender Name</label>
      <input class="input" name="sender_name" required>
    </div>

    <div>
      <label>Sender Phone</label>
      <input class="input" name="sender_phone" required placeholder="+2547...">
    </div>

    <div>
      <label>Recipient Name</label>
      <input class="input" name="recipient_name" required>
    </div>

    <div>
      <label>Recipient Phone</label>
      <input class="input" name="recipient_phone" required placeholder="+2547...">
    </div>

    <!-- NEW: Origin & Destination dropdowns -->
    <div>
      <label>Origin (Pickup location)</label>
      <select class="input" name="origin" required>
        <option value="" disabled selected>Select origin</option>
        {% for loc in locations %}
          <option value="{{ loc['name'] }}">{{ loc['name'] }}</option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Destination (Recipient location)</label>
      <select class="input" name="destination" required>
        <option value="" disabled selected>Select destination</option>
        {% for loc in locations %}
          <option value="{{ loc['name'] }}">{{ loc['name'] }}</option>
        {% endfor %}
      </select>
    </div>
    <!-- /NEW -->

    <div>
      <label>Description</label>
      <input class="input" name="description" placeholder="Small electronics">
    </div>

    <div>
      <label>Weight (kg)</label>
      <input class="input" type="number" step="0.01" name="weight">
    </div>

    <div>
      <label>Fee (KES)</label>
      <input class="input" type="number" step="0.01" name="fee" value="300">
    </div>
  </div>

  <div style="margin-top:12px">
    <button class="btn" type="submit">Save &amp; Generate Tracking</button>
  </div>
</form>
{% endblock %}
