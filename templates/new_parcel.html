{% extends "base.html" %}
{% block title %}{{ "Edit Parcel" if parcel else "New Parcel" }} · QikSend-X{% endblock %}

{% block content %}
<h1 class="h1">{{ "Edit Parcel" if parcel else "Create New Parcel" }}</h1>

<form method="post" class="card">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  {% if error %}
  <div class="notice" style="border-left:4px solid #ef4444;margin-bottom:12px">{{ error }}</div>
  {% endif %}

  <div class="form-grid">
    <div>
      <label>Sender</label>
      <select class="input" name="sender_id" required>
        <option value="" disabled {{ '' if parcel else 'selected' }}>Select sender</option>
        {% for c in customers %}
          <option value="{{ c['id'] }}" {{ 'selected' if parcel and parcel['sender_id'] == c['id'] else '' }}>
            {{ c['name'] }} ({{ c['phone'] }})
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Recipient</label>
      <select class="input" name="recipient_id" required>
        <option value="" disabled {{ '' if parcel else 'selected' }}>Select recipient</option>
        {% for c in customers %}
          <option value="{{ c['id'] }}" {{ 'selected' if parcel and parcel['recipient_id'] == c['id'] else '' }}>
            {{ c['name'] }} ({{ c['phone'] }})
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Origin Branch</label>
      <select class="input" name="origin_branch_id" required>
        <option value="" disabled {{ '' if parcel else 'selected' }}>Select origin</option>
        {% for b in branches %}
          <option value="{{ b['id'] }}" {{ 'selected' if parcel and parcel['origin_branch_id'] == b['id'] else '' }}>
            {{ b['name'] }} - {{ b['location'] }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Destination Branch</label>
      <select class="input" name="destination_branch_id" required>
        <option value="" disabled {{ '' if parcel else 'selected' }}>Select destination</option>
        {% for b in branches %}
          <option value="{{ b['id'] }}" {{ 'selected' if parcel and parcel['destination_branch_id'] == b['id'] else '' }}>
            {{ b['name'] }} - {{ b['location'] }}
          </option>
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Assign Courier (required)</label>
      <select class="input" name="courier_id" required>
        <option value="" disabled selected>Select courier</option>
        {% for r in couriers %}
          {% if r['active'] %}
            <option value="{{ r['id'] }}" {{ 'selected' if parcel and parcel['courier_id'] == r['id'] else '' }}>
              {{ r['name'] }} ({{ r['phone'] }})
            </option>
          {% endif %}
        {% endfor %}
      </select>
    </div>

    <div>
      <label>Description</label>
      <input class="input" name="description" value="{{ parcel['description'] if parcel else '' }}" placeholder="Small electronics">
    </div>

    <div>
      <label>Amount (KES)</label>
      <input class="input" type="number" step="0.01" min="0" max="1000000"
             name="amount"
             value="{{ parcel['amount'] if parcel else 300 }}"
             required>
    </div>
  </div>

  <div style="margin-top:12px">
    <button class="btn" type="submit">{{ "Save Changes" if parcel else "Save & Generate Tracking" }}</button>
  </div>
</form>
{% endblock %}
