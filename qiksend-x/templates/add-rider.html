<!-- templates/add-rider.html -->
{% extends 'base.html' %}

{% block title %}Add Rider | QikSend-X{% endblock %}

{% block content %}
<h2>Add New Rider</h2>

<form action="{{ url_for('add_rider') }}" method="POST" class="form-container">
  <label>Rider Name</label>
  <input type="text" name="name" required>

  <label>Phone Number</label>
  <input type="text" name="phone" required>

  <button type="submit">Save Rider</button>
</form>
{% endblock %}
