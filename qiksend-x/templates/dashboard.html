<!-- templates/dashboard.html -->
{% extends 'base.html' %}

{% block title %}Dashboard | QikSend-X{% endblock %}

{% block content %}
<h2>Welcome to QikSend-X Dashboard</h2>

<div class="dashboard-cards">
  <div class="card">
    <h3>Total Deliveries</h3>
    <p>{{ total_deliveries }}</p>
  </div>
  <div class="card">
    <h3>Pending Deliveries</h3>
    <p>{{ pending_deliveries }}</p>
  </div>
  <div class="card">
    <h3>Active Riders</h3>
    <p>{{ total_riders }}</p>
  </div>
</div>

<div class="quick-links">
  <a href="{{ url_for('add_delivery') }}" class="btn">+ Add Delivery</a>
  <a href="{{ url_for('add_rider') }}" class="btn">+ Add Rider</a>
</div>
{% endblock %}
